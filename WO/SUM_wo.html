<!DOCTYPE html>
<html>
<head>
  <title>Excel Worker Summary</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f8;
      color: #333;
      padding: 20px;
    }

    h2 { color: #007acc; }
    h3 { margin-top: 30px; color: #005a99; }

    input[type="file"], select, input[type="text"] {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      width: 250px;
    }

    /* 🔥 GRID CHECKBOX */
    .checkbox-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px 12px;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 5px;
      background: #fff;
    }

    .checkbox-list label {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
    }

    .checkbox-controls {
      margin-bottom: 10px;
    }

    .checkbox-controls button {
      padding: 5px 10px;
      margin-right: 5px;
      border-radius: 5px;
      border: 1px solid #007acc;
      background-color: #fff;
      cursor: pointer;
    }

    .checkbox-controls button:hover {
      background-color: #007acc;
      color: white;
    }

    .worker {
      margin-bottom: 15px;
      padding: 10px;
      border-left: 4px solid #007acc;
      border-radius: 5px;
      background: #fff;
    }

    .low-time {
      background-color: #ffe5e5;
      border-left-color: red;
    }
  </style>
</head>
<body>

<h2>Upload File Excel (.xlsx)</h2>
<input type="file" id="fileInput" accept=".xlsx" />

<h3>Sort by:</h3>
<select id="sortSelect">
  <option value="name">Worker Name (A-Z)</option>
  <option value="minutes_desc">Total Minutes (High → Low)</option>
  <option value="minutes_asc">Total Minutes (Low → High)</option>
</select>

<h3>Select Workers:</h3>

<input type="text" id="searchWorker" placeholder="Cari worker..." />

<div class="checkbox-controls">
  <button id="selectAllBtn">Select All</button>
  <button id="deselectAllBtn">Deselect All</button>
</div>

<div class="checkbox-list" id="workerCheckboxes"></div>

<h3>Hasil:</h3>
<div id="output"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
let globalResults = {};

const fileInput = document.getElementById('fileInput');
const sortSelect = document.getElementById('sortSelect');
const workerCheckboxes = document.getElementById('workerCheckboxes');
const output = document.getElementById('output');

fileInput.addEventListener('change', handleFile);
sortSelect.addEventListener('change', () => displayResult(globalResults));

document.getElementById('selectAllBtn').onclick = () => toggleAll(true);
document.getElementById('deselectAllBtn').onclick = () => toggleAll(false);

document.getElementById('searchWorker').addEventListener('input', function() {
  const keyword = this.value.toLowerCase();

  document.querySelectorAll('#workerCheckboxes label').forEach(label => {
    const text = label.textContent.toLowerCase();
    label.style.display = text.includes(keyword) ? 'flex' : 'none';
  });
});

function handleFile(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    processData(json);
  };

  reader.readAsArrayBuffer(file);
}

function processData(data) {
  const results = {};

  data.forEach(row => {
    const name = row.worker_name;
    const duration = parseFloat(row.duration_minute_worker);

    let dateRaw = row.wo_date;
    let date;

    if (typeof dateRaw === 'number') {
      const d = XLSX.SSF.parse_date_code(dateRaw);
      date = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    } else {
      date = dateRaw;
    }

    if (!name || isNaN(duration) || !date) return;

    if (!results[name]) results[name] = {};
    if (!results[name][date]) results[name][date] = 0;

    results[name][date] += duration;
  });

  globalResults = results;
  renderCheckboxes(Object.keys(results));
  displayResult(results);
}

function renderCheckboxes(names) {
  workerCheckboxes.innerHTML = '';

  names.sort().forEach(name => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" value="${name}" checked> ${name}`;
    workerCheckboxes.appendChild(label);
  });

  document.querySelectorAll('#workerCheckboxes input').forEach(cb => {
    cb.onchange = () => displayResult(globalResults);
  });
}

function toggleAll(state) {
  document.querySelectorAll('#workerCheckboxes input')
    .forEach(cb => cb.checked = state);

  displayResult(globalResults);
}

function displayResult(results) {
  const sortOption = sortSelect.value;

  const selected = Array.from(
    document.querySelectorAll('#workerCheckboxes input:checked')
  ).map(cb => cb.value);

  let workers = Object.entries(results)
    .filter(([name]) => selected.includes(name));

  if (sortOption === 'name') {
    workers.sort((a,b)=> a[0].localeCompare(b[0]));
  } else {
    workers.sort((a,b)=> {
      const sumA = Object.values(a[1]).reduce((x,y)=>x+y,0);
      const sumB = Object.values(b[1]).reduce((x,y)=>x+y,0);
      return sortOption === 'minutes_desc' ? sumB - sumA : sumA - sumB;
    });
  }

  output.innerHTML = '';

  workers.forEach(([worker, dates]) => {
    const div = document.createElement('div');

    let totalAll = 0;
    let html = `<strong>${worker}</strong><br><br>`;

    Object.entries(dates)
      .sort((a,b)=> a[0].localeCompare(b[0]))
      .forEach(([date, minutes]) => {

        totalAll += minutes;

        const hDec = (minutes / 60).toFixed(2);
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;

        html += `
          📅 ${date}<br>
          ${minutes} menit<br>
          ${hDec} jam<br>
          ${h} jam ${m} menit<br><br>
        `;
      });

    html += `<strong>Total: ${totalAll} menit (${(totalAll/60).toFixed(2)} jam)</strong>`;

    div.className = 'worker';
    if (totalAll < 360) div.classList.add('low-time');

    div.innerHTML = html;
    output.appendChild(div);
  });
}
</script>

</body>
</html>
