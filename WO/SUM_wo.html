<!DOCTYPE html>
<html>
<head>
  <title>Worker Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7f8;
      padding: 15px;
      font-size: 13px;
    }
    h2, h3 { color: #007acc; margin-bottom: 8px; }

    input, select, button {
      padding: 6px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .checkbox-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
      background: #fff;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    .checkbox-controls { margin-bottom: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 10px;
    }

    th {
      background: #007acc;
      color: white;
      text-align: left;
      padding: 8px;
    }

    td { padding: 8px; border-bottom: 1px solid #eee; }

    tr:hover { background: #f1f9ff; cursor: pointer; }

    .low { color: red; font-weight: bold; }

    .details { display: none; background: #fafafa; }
    .date-box { margin-bottom: 6px; padding:6px; border-left:3px solid #007acc; background:#fff; border-radius:4px; }
    .date-title { font-weight:bold; color:#007acc; }
  </style>
</head>
<body>

<h2>Upload Excel</h2>
<input type="file" id="fileInput" accept=".xlsx">

<h3>Filter Worker</h3>
<div class="checkbox-controls">
  <button onclick="toggleAll(true)">Select All</button>
  <button onclick="toggleAll(false)">Deselect All</button>
</div>
<div class="checkbox-list" id="workerCheckboxes"></div>

<h3>Filter Tanggal</h3>
<input type="date" id="startDate"> s/d <input type="date" id="endDate">

<h3>Top Worker Chart</h3>
<canvas id="chart" height="100"></canvas>

<h3>Worker Table</h3>
<table id="table">
  <thead>
    <tr><th>Worker</th><th>Total (Jam)</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
let globalResults = {};

document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('startDate').addEventListener('change', renderAll);
document.getElementById('endDate').addEventListener('change', renderAll);

let chart;

function handleFile(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(evt){
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data,{type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);
    processData(json);
  };
  reader.readAsArrayBuffer(file);
}

function processData(data){
  const results = {};
  data.forEach(row=>{
    const name = row.worker_name;
    const duration = parseFloat(row.duration_minute_worker);
    let dateRaw = row.wo_date;
    let date;
    if(typeof dateRaw==='number'){
      const d = XLSX.SSF.parse_date_code(dateRaw);
      date = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    } else date = dateRaw;
    if(!name||isNaN(duration)||!date) return;
    if(!results[name]) results[name]={};
    if(!results[name][date]) results[name][date]=0;
    results[name][date] += duration;
  });
  globalResults = results;
  renderCheckboxes(Object.keys(results));
  renderAll();
}

function renderCheckboxes(names){
  const container=document.getElementById('workerCheckboxes');
  container.innerHTML='';
  names.sort().forEach(name=>{
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" value="${name}" checked> ${name}`;
    container.appendChild(label);
  });
  document.querySelectorAll('#workerCheckboxes input').forEach(cb=>{
    cb.onchange=renderAll;
  });
}

function getSelectedWorkers(){
  return Array.from(document.querySelectorAll('#workerCheckboxes input:checked')).map(cb=>cb.value);
}

function toggleAll(state){
  document.querySelectorAll('#workerCheckboxes input').forEach(cb=>cb.checked=state);
  renderAll();
}

function renderAll(){
  const tbody=document.querySelector('#table tbody');
  tbody.innerHTML='';
  const selected=getSelectedWorkers();
  const start=document.getElementById('startDate').value;
  const end=document.getElementById('endDate').value;
  let chartData = [];

  const workers = Object.entries(globalResults)
    .filter(([name])=>selected.includes(name))
    .map(([name,dates])=>{
      let filteredDates = {};
      Object.entries(dates).forEach(([date,min])=>{
        if((!start||date>=start)&&(!end||date<=end)) filteredDates[date]=min;
      });
      const total = Object.values(filteredDates).reduce((a,b)=>a+b,0);
      chartData.push({name,total});
      return {name,dates:filteredDates,total};
    });

  chartData.sort((a,b)=>b.total-a.total);

  workers.forEach(w=>{
    const tr=document.createElement('tr');
    const totalJam=(w.total/60).toFixed(2);
    tr.innerHTML=`<td>${w.name}</td><td class="${w.total<360?'low':''}">${totalJam} jam</td>`;
    const detailRow=document.createElement('tr');
    detailRow.className='details';
    let detailHTML='';
    Object.entries(w.dates).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,min])=>{
      detailHTML+=`<div class="date-box"><div class="date-title">📅 ${date}</div><div>${min} menit (${(min/60).toFixed(2)} jam)</div></div>`;
    });
    detailRow.innerHTML=`<td colspan="2">${detailHTML}</td>`;
    tr.onclick=()=>detailRow.style.display=detailRow.style.display==='table-row'?'none':'table-row';
    tbody.appendChild(tr);
    tbody.appendChild(detailRow);
  });

  renderChart(chartData);
}

function renderChart(data){
  const ctx=document.getElementById('chart').getContext('2d');
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:'bar',
    data:{
      labels:data.map(d=>d.name),
      datasets:[{
        label:'Total Jam',
        data:data.map(d=>(d.total/60).toFixed(2)),
        backgroundColor:'#007acc'
      }]
    },
    options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
  });
}
</script>

</body>
</html>
