<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Code Generator</title>
    <link rel="stylesheet" type="text/css" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Header dengan desain tetap menarik -->
    <header class="header">
        <h1>NBA CODE GENERATOR</h1>
        <p>Konversi IP Address ke Kode DC dengan cepat dan mudah!</p>
    </header>

    <div class="container">
        <label for="input">Masukkan Input:</label>
        <textarea id="input" placeholder="Contoh:\n10.13.1.11\n10.13.2.22"></textarea>
        
        <div class="button-group">
            <button onclick="generateNBA()">Generate</button>
            <button onclick="extractDC()">Get DC Name</button>
            <button onclick="copyOutput()">Copy Data</button>
        </div>
        
        <button class="reset-btn" onclick="resetForm()">Reset</button>
        
        <pre id="output"></pre>
    </div>

    <footer class="credit">
        <p>All rights reserved by Fikri Ilhami Syah Putra Copyright 2024</p>
        <div class="social-icons">
            <a href="https://www.instagram.com/fikrie_syahputra" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/fikrie.i.s" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.linkedin.com/in/fikri-ilhami-syah-putra-7a1337173" target="_blank"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </footer>

    <script src="js/dcName.js"></script>
    <script src="js/rack.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
